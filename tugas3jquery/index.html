<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator - Jason Enkristo 255150701111032</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <img src="cloudheart.png" alt="cloud" class="cloud1">
    <img src="cloudheart.png" alt="cloud" class="cloud2">
    <img src="balloon.png" alt="balloon" class="balloon1">
    <img src="balloon.png" alt="balloon" class="balloon2">
    <div id="heart-container"></div>
    <header class="judul">
      <h1>Kalkulator Jason Enkristo - 255150701111032</h1>
    </header>
    
    <main class="container">
      <img src="catheart.png" alt="catheart" class="catheart">
      <div class="input">
        <input type="text" class="layar" />
      </div>
      <div class="AC">
        <button>AC</button>
      </div>
      <div class="row-1">
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator">+</button>
      </div>
      <div class="row-2">
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">-</button>
      </div>
      <div class="row-3">
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">*</button>
      </div>
      <div class="row-4">
        <button class="number">0</button>
        <button class="number">.</button>
        <button class="equals">=</button>
        <button class="operator">/</button>
      </div>
    </main>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>
    <script src="script.js"></script>
  </body>
</html>
