<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Operasi Matriks TensorFlow.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background-color: #0f172a;
        color: #f8fafc;
      }
      pre {
        background: #1e293b;
        padding: 15px;
        border-radius: 6px;
        border: 1px solid #334155;
      }
      button {
        padding: 8px 16px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Operasi Matriks Dasar (TensorFlow.js CDN)</h2>
    <button onclick="calculateMatrices()">Hitung Matriks</button>
    <pre id="output">
Klik tombol di atas untuk menjalankan perhitungan matriks...</pre
    >

    <script>
      function calculateMatrices() {
        const rawA = [
          [4, 7],
          [2, 6],
        ];
        const rawB = [
          [1, 3],
          [5, 2],
        ];

        const tensorA = tf.tensor2d(rawA);
        const tensorB = tf.tensor2d(rawB);

        const transposeA = tf.transpose(tensorA);
        const addition = tf.add(tensorA, tensorB);

        const multiplication = tf.matMul(tensorA, tensorB);

        const a = rawA[0][0],
          b = rawA[0][1],
          c = rawA[1][0],
          d = rawA[1][1];
        const det = a * d - b * c;

        let inverseOutput;
        if (det === 0) {
          inverseOutput = "Matriks Singular (Tidak memiliki inverse)";
        } else {
          const invArray = [
            [d / det, -b / det],
            [-c / det, a / det],
          ];
          const tensorInv = tf.tensor2d(invArray);
          inverseOutput = JSON.stringify(tensorInv.arraySync(), null, 2);
        }

        const logText = `Matriks A:
        ${JSON.stringify(tensorA.arraySync())}

        Matriks B:
        ${JSON.stringify(tensorB.arraySync())}

        1. Transpose Matriks A:
        ${JSON.stringify(transposeA.arraySync(), null, 2)}

        2. Penjumlahan (A + B):
        ${JSON.stringify(addition.arraySync(), null, 2)}

        3. Perkalian Matriks (A x B):
        ${JSON.stringify(multiplication.arraySync(), null, 2)}

        4. Inverse Matriks A:
        ${inverseOutput}`;

        document.getElementById("output").innerText = logText;
      }
    </script>
  </body>
</html>
