<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Scientific</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1e1e2e; }
    .calculator { background: #2d2d3f; padding: 20px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #display { width: 100%; height: 50px; background: #181825; color: #a6e3a1; text-align: right; font-size: 1.5rem; padding: 10px; box-sizing: border-box; border: none; border-radius: 6px; margin-bottom: 15px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { padding: 12px; font-size: 1rem; border: none; border-radius: 6px; background: #45475a; color: #cdd6f4; cursor: pointer; }
    button:hover { background: #585b70; }
    button.operator { background: #89b4fa; color: #11111b; font-weight: bold; }
    button.action { background: #f38ba8; color: #11111b; font-weight: bold; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly value="0">
    <div class="grid">
      <button class="action" onclick="clearDisplay()">C</button>
      <button onclick="appendOp('^')">x^y</button>
      <button onclick="execMath('sqrt')">√</button>
      <button class="operator" onclick="appendOp('/')">/</button>

      <button onclick="execMath('sin')">sin</button>
      <button onclick="execMath('cos')">cos</button>
      <button onclick="execMath('tan')">tan</button>
      <button class="operator" onclick="appendOp('*')">*</button>

      <button onclick="execMath('log')">log</button>
      <button onclick="execMath('ln')">ln</button>
      <button onclick="appendNum('(')">(</button>
      <button onclick="appendNum(')')">)</button>

      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="operator" onclick="appendOp('-')">-</button>

      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="operator" onclick="appendOp('+')">+</button>

      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="action" onclick="calculateResult()" style="grid-row: span 2; height: 100%;">=</button>

      <button onclick="appendNum('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendNum('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendNum(val) {
      if (display.value === '0' && val !== '.') display.value = val;
      else display.value += val;
    }

    function appendOp(op) {
      display.value += ' ' + op + ' ';
    }

    function clearDisplay() {
      display.value = '0';
    }

    function execMath(func) {
      try {
        let val = eval(display.value.replace(/[\^]/g, '**'));
        if (func === 'sin') val = Math.sin(val * (Math.PI / 180)); // Derajat ke Radian
        else if (func === 'cos') val = Math.cos(val * (Math.PI / 180));
        else if (func === 'tan') val = Math.tan(val * (Math.PI / 180));
        else if (func === 'log') val = Math.log10(val);
        else if (func === 'ln') val = Math.log(val);
        else if (func === 'sqrt') val = Math.sqrt(val);

        display.value = Number(val.toFixed(6)).toString();
      } catch (e) {
        display.value = 'Error';
      }
    }

    function calculateResult() {
      try {
        let expression = display.value.replace(/[\^]/g, '**');
        let res = eval(expression);
        display.value = Number(res.toFixed(6)).toString();
      } catch (e) {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
